# Local production-like run: one app container (API + built SPA) and Postgres.
# Defaults use the fixture X API so it works without credentials. For real X
# access set X_API_MODE=live plus X_CLIENT_ID / X_CLIENT_SECRET / X_REDIRECT_URI.
# Secrets must be supplied: generate them with
#   cd backend && uv run python -m app.cli gen-secrets
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bkmk
      POSTGRES_PASSWORD: bkmk-local-only
      POSTGRES_DB: bkmk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkmk"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://bkmk:bkmk-local-only@db:5432/bkmk
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-http://localhost:8080/api/auth/x/callback}
      LIVE_SYNC_ENABLED: ${LIVE_SYNC_ENABLED:-true}
      X_API_MODE: ${X_API_MODE:-fixture}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY}

volumes:
  pgdata:
