# Render Blueprint: one Docker web service + managed Postgres.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: bkmk
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: bkmk-db, property: connectionString }
      - key: FRONTEND_URL
        sync: false # e.g. https://bkmk.onrender.com
      - key: X_REDIRECT_URI
        sync: false # https://<host>/api/auth/x/callback — must match the X app exactly
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # 32-byte url-safe base64: uv run python -m app.cli gen-secrets
      - key: SCAN_MAX_BOOKMARKS
        value: "800"
      - key: SCAN_COOLDOWN_SECONDS
        value: "3600"

databases:
  - name: bkmk-db
    plan: basic-256mb
    databaseName: bkmk
    user: bkmk
