# Render Blueprint: the API as one free Docker web service.
# The frontend is on Vercel and proxies /api/* here; Postgres is on Neon.
# Values marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: bkmk-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Database-free probe: Render checks every few seconds, and a DB query here
    # would keep Neon's compute from ever scaling to zero.
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Neon direct connection string (not -pooler), with sslmode=require
      - key: FRONTEND_URL
        sync: false # https://<your-app>.vercel.app — the only origin browsers use
      - key: X_REDIRECT_URI
        sync: false # https://<your-app>.vercel.app/api/auth/x/callback — must match the X app exactly
      # Free by default: no X API calls, users import files in the browser.
      # true = live bookmark sync through X's paid API (needs the X credentials below and credit).
      - key: LIVE_SYNC_ENABLED
        value: "false"
      - key: X_CLIENT_ID
        sync: false # only needed with LIVE_SYNC_ENABLED=true
      - key: X_CLIENT_SECRET
        sync: false # only needed with LIVE_SYNC_ENABLED=true
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # 32-byte url-safe base64: uv run python -m app.cli gen-secrets
      - key: X_DAILY_BUDGET_USD
        value: "2.00"
      - key: SCAN_MAX_BOOKMARKS
        value: "200"
      - key: SCAN_COOLDOWN_SECONDS
        value: "3600"
      - key: ALLOWED_X_USERNAMES
        sync: false # optional private-beta allowlist, comma-separated; leave empty for anyone
      - key: DATA_RETENTION_DAYS
        value: "90"
